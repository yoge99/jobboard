name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "jobboard-frontend/**"

  pull_request:
    branches:
      - main
    paths:
      - "jobboard-frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: jobboard-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build